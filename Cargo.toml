[workspace]
members = [ "analysis",
    "programs/*", "simulation",
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace.dependencies]
blake3 = { version = "=1.5.0", default-features = false, features = ["std"] }
arrayref = "=0.3.7"
arrayvec = "=0.7.4"
cfg-if = "=1.0.0"
constant_time_eq = "=0.3.0"
digest = "=0.10.7"
