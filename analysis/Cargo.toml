[package]
name = "analysis"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
csv = "1.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
clap = { version = "4.5.54", features = ["derive"] }
statrs = "0.18.0"
rayon = "1.10"
polars = { version = "=0.49.1", features = ["lazy", "temporal"] }
glob = "0.3"
indicatif = "0.18.3"
plotters = "0.3"
solana-sdk = "3.0.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
