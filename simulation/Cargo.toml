[package]
name = "simulation"
version = "0.1.0"
edition = "2021"

[features]
default = ["create-user-lp-token-account", "min-output", "payer-sign"]
create-user-lp-token-account = []
payer-sign = []
min-output = []
# Track user balances every slot (adds performance overhead, not enabled by default)
track_user_balances = []

[dependencies]
litesvm = "0.9.0"
anchor-lang = "0.32.1"
# anchor-spl = "0.32.1"
csv = "1.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cpmm-rebalansing = { path = "../programs/cpmm-rebalansing", features = ["no-entrypoint"] }
solana-sdk = "3.0.0"
litesvm-token = "0.9.0"
spl-token = { version = "9.0.0", features = ["no-entrypoint"] }
spl-associated-token-account  = { version = "8.0.0", features = ["no-entrypoint"] }
spl-associated-token-account-interface ="2.0.0"
thiserror = "2.0.17"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
sha2 = "0.10.9"
solana-program = "3.0.0"
borsh = "1.6.0"
tokio = { version = "1.0", features = ["full"] }
spl-math = "0.3.0"
rand = "0.9.2"
rand_distr = "0.5.1"
derivative = "2.2.0"
anyhow = "1.0.71"
clap = { version = "4.3.7", features = ["derive"] }
tempfile = "3.24.0"
rayon = "1.11.0"

[[bin]]
name = "sim_dual"
path = "src/bin/sim_dual.rs"

[[bin]]
name = "sim_standard"
path = "src/bin/sim_standard.rs"

# Single Vault + User Noise
[[bin]]
name = "single_no_arb_32"
path = "src/bin/single_no_arb_32.rs"

[[bin]]
name = "single_no_arb_128"
path = "src/bin/single_no_arb_128.rs"

[[bin]]
name = "single_no_arb_512"
path = "src/bin/single_no_arb_512.rs"
# Single Vault + Arbitrage
[[bin]]
name = "single_32"
path = "src/bin/single_32.rs"

[[bin]]
name = "single_128"
path = "src/bin/single_128.rs"

[[bin]]
name = "single_512"
path = "src/bin/single_512.rs"
# Dual Vault + User Noise
[[bin]]
name = "dual_no_arb_32"
path = "src/bin/dual_no_arb_32.rs"

[[bin]]
name = "dual_no_arb_128"
path = "src/bin/dual_no_arb_128.rs"
[[bin]]
name = "dual_no_arb_512"
path = "src/bin/dual_no_arb_512.rs"

# Dual Vault + Arbitrage
[[bin]]
name = "dual_32"
path = "src/bin/dual_32.rs"

[[bin]]
name = "dual_128"
path = "src/bin/dual_128.rs"
[[bin]]
name = "dual_512"
path = "src/bin/dual_512.rs"


